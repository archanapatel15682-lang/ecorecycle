<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - EcoRecycle</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav>

        <h2>♻️ EcoRecycle</h2>

        <div>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/register">Register</a>
            <a href="/contact">Contact</a>
        </div>

    </nav>


    <!-- =========================
         LOGIN FORM
    ========================== -->

    <section class="form-container">

        <h1>Login</h1>

        <!-- Flask Flash Messages -->

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form action="{{ url_for('login') }}" method="POST">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <!-- Register Link -->

        <p>
            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register here
            </a>
        </p>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 EcoRecycle |
            Plastic Waste Collection & Recycling
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
